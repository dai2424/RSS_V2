runtime_dir = "runtime"
database_path = "runtime/db/rss_v2.db"
api_host = "127.0.0.1"
api_port = 8000
rss_timeout_seconds = 20.0
worker_lease_seconds = 300
worker_poll_seconds = 2.0

llm_retry_cooldown_seconds = 60
llm_enrich_title_threshold = 40
llm_enrich_text_threshold = 300

# 加工前注入词表：条数上限（0 关闭注入）与"近期新增"的时间窗（天）。
llm_vocabulary_limit = 150
llm_vocabulary_recent_days = 7

# 热词口径：最近多少天、出现多少次才算热词（注入的热词段、词表页默认视图、常驻推荐；
# 注入的「近期新增」段与常驻词不受门槛限制）。
keyword_hot_days = 7
keyword_hot_min_mentions = 5

# 合并建议每批的词数：受 Provider 超时与单次输出上限约束，不是输入上下文。
llm_suggestion_batch_size = 20
