runtime_dir = "runtime"
database_path = "runtime/db/rss_v2.db"
api_host = "127.0.0.1"
api_port = 8000
rss_timeout_seconds = 20.0
worker_lease_seconds = 300
worker_poll_seconds = 2.0

llm_retry_cooldown_seconds = 60
llm_enrich_title_threshold = 40
llm_enrich_text_threshold = 300

# 加工前注入词表：条数上限（0 关闭注入）与"近期新增"的时间窗（天）。
llm_vocabulary_limit = 150
llm_vocabulary_recent_days = 7

# 热词口径：最近多少天、出现多少次才算热词（注入的热词段、词表页默认视图、常驻推荐；
# 注入的「近期新增」段与常驻词不受门槛限制）。
keyword_hot_days = 7
keyword_hot_min_mentions = 5

# 合并建议每批的词数：受 Provider 超时与单次输出上限约束，不是输入上下文。
llm_suggestion_batch_size = 20

# 选题发现（阶段 4）：默认最近 7 天、全部订阅；窗口内消息超过上限时返回明确错误，
# 提示缩小时间范围或增加筛选，不做静默截断。分批大小与单批字符上限共同决定
# 一次模型调用的输入长度，批次条数 ≈ 窗口内消息数 / discovery_batch_size。
discovery_window_days = 7
discovery_max_window_days = 90
discovery_max_window_messages = 400
discovery_batch_size = 40
discovery_batch_chars = 60000
discovery_max_members = 20
discovery_max_candidates = 50
# 单次模型调用的输出上限；超出会把这一批对半拆开重试（最多两层）。
discovery_max_output_tokens = 8192

# 资料准备（阶段 4 P3a）：联网检索与原文读取。
# search_base_url 指向 SearXNG 兼容端点（GET {base}/search?q=…&format=json），
# 实例必须开启 JSON 输出（search.formats 含 json），否则请求会返回 403。
# 留空时资料任务会以 search_unconfigured 明确失败，不会用摘要冒充已读资料。
search_base_url = ""
search_timeout_seconds = 20.0
search_result_limit = 8
article_read_timeout_seconds = 20.0
article_max_bytes = 2000000
# 每个项目的检索式条数与网络读取条数上限；超限的候选会落成"未读取"并在摘要里说明。
materials_max_queries = 3
materials_max_reads = 12

# 资料整理（阶段 4 P3b）：把已读资料整理成事实/分歧/缺口。
# 单份资料放进提示词的正文长度、输入总长度与事实条数上限；引文必须能在资料里定位，
# 找不到的引文会丢弃并计数（不会当成"有依据"）。
materials_digest_max_input_chars = 80000
digest_material_chars = 4000
digest_max_facts = 40
# 每次调用整理几份资料、单次输出的 token 上限；写不完会自动把这一批对半拆开重试。
digest_batch_size = 6
digest_max_output_tokens = 8192
digest_max_evidence_per_fact = 4
# 允许读取本机/内网地址：仅本机夹具（tests/preview.py）或内网资料源使用；
# 默认 false，生产环境必须保持 false，避免检索结果把应用当成内网代理。
article_allow_private_hosts = false
