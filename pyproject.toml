[project]
name = "rss-v2"
version = "0.1.0"
description = "可维护的 RSS 情报工作台"
requires-python = ">=3.12,<3.13"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "feedparser>=6.0,<7",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "uvicorn[standard]>=0.32,<1",
]

[dependency-groups]
dev = [
    "pyright>=1.1.390,<2",
    "pytest>=8.3,<9",
    "pytest-cov>=6,<7",
    "respx>=0.21,<1",
    "ruff>=0.8,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rss_v2"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# SQL 列清单保持与迁移字段顺序一致；仅适配器和升级 fixture 允许长 SQL。
"src/rss_v2/adapters/sqlite/*.py" = ["E501"]
"tests/integration/test_migrations.py" = ["E501"]

[tool.pyright]
include = ["src"]
exclude = ["**/__pycache__", "frontend"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
